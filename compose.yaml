# Docker Compose deployment.
#
#   cp .env.example .env     # then fill in the values
#   docker compose up -d
#
# The `cors-setup` service is opt-in behind a profile, so `up` only starts the
# gateway. Run it explicitly when the bucket rule needs writing:
#
#   docker compose run --rm cors-setup
#   docker compose run --rm -e ACTION=show cors-setup
#
# Or, where `compose run` is unavailable: COMPOSE_PROFILES=setup docker compose up -d
services:
  gateway:
    image: ghcr.io/florianobermayer/s3-presign-gateway:latest
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      ALLOW_PREFIX: ${ALLOW_PREFIX:-hls/}
      PRESIGN_TTL_SECONDS: ${PRESIGN_TTL_SECONDS:-300}
      # Optional: a secret path prefix that every request must carry.
      ACCESS_TOKENS: ${ACCESS_TOKENS:-}
      # Keep this identical to the bucket CORS rule: the browser sends the
      # page's origin on both the redirect and the presigned request.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # One-off task that writes the bucket CORS rule. It needs a write-capable key,
  # so it is opt-in: it only runs when asked, and the gateway never sees these
  # credentials. Same image as the gateway, invoked with -setup-cors.
  #
  # Afterwards remove S3_ADMIN_* from the deployment.
  cors-setup:
    profiles: ["setup"]
    image: ghcr.io/florianobermayer/s3-presign-gateway:latest
    build:
      context: .
    command: ["-setup-cors"]
    restart: "no"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_ACCESS_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ACTION: ${ACTION:-apply}
    security_opt:
      - no-new-privileges:true
