# Portainer stack / docker compose. Build locally with: docker compose up -d --build
services:
  gateway:
    image: ghcr.io/florianobermayer/s3-presign-gateway:latest
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      ALLOW_PREFIX: ${ALLOW_PREFIX:-hls/}
      PRESIGN_TTL_SECONDS: ${PRESIGN_TTL_SECONDS:-300}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
