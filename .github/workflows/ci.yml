name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs, because a tag can be moved but a SHA
# cannot. The trailing comment records which release each SHA belongs to, so
# bumps are easy to review.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No dependencies, so there is no go.sum to key a cache on.
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Require SHA-pinned actions
        # A tag can be repointed at any commit, including a malicious one, so
        # every action reference must be a full 40-character commit SHA.
        run: |
          unpinned=$(grep -hoE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*[^[:space:]]+' \
            .github/workflows/*.yml |
            sed -E 's/^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*//' |
            grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$unpinned" ]; then
            echo "These action references are not pinned to a commit SHA:"
            echo "$unpinned"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -ldflags "-s -w" -o /dev/null .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build binaries
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name=s3-presign-gateway_${GITHUB_REF_NAME}_${os}_${arch}
            bin=s3-presign-gateway
            [ "$os" = windows ] && bin=s3-presign-gateway.exe
            echo "building $name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/$bin" .
            if [ "$os" = windows ]; then
              (cd dist && zip -q "$name.zip" "$bin" && rm "$bin")
            else
              tar -czf "dist/$name.tar.gz" -C dist "$bin" && rm "dist/$bin"
            fi
          done
          cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt && cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/checksums.txt

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
